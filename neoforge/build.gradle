plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.143'
}

version = "${project.mod_version}-${project.minecraft_version}-neoforge"

base {
    archivesName = mod_id
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
        }
        configureEach {
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    // include common classes from root project
    implementation project(":")
}

tasks.named('jar', Jar) {
    dependsOn project(':').tasks.named('classes')
    // include compiled output from root project
    from project(':').sourceSets.main.output.classesDirs
}

processResources {
    filteringCharset = "UTF-8"

    // include resources from root
    dependsOn project(':').tasks.named('classes')
    from project(':').sourceSets.main.resources
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [minecraft_version      : minecraft_version,
                             minecraft_version_range: minecraft_version_range,
                             neo_version            : neo_version,
                             neo_version_range      : neo_version_range,
                             loader_version_range   : loader_version_range,
                             mod_id                 : mod_id,
                             mod_name               : mod_name,
                             mod_license            : mod_license,
                             mod_version            : project.version,
                             mod_authors            : mod_authors,
                             mod_issue_tracker      : mod_issue_tracker,
                             mod_description        : mod_description]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

tasks.named('createMinecraftArtifacts') {
    dependsOn tasks.named('generateModMetadata')
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
