modLoader = "javafml"
loaderVersion = "*"
license = "${mod_license}"
issueTrackerURL="${mod_issue_tracker}"
[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
logoFile="assets/widgets/icon.png" #optional
authors = "${mod_authors}"
description = '''${mod_description}'''

[[mixins]]
config = "${mod_id}.mixins.json"

[[accessTransformers]]
file="META-INF/accesstransformer.cfg"
